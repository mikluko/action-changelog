name: Changelog
description: Read a Keep a Changelog document and report where it departs from the format.
branding:
  icon: check-square
  color: purple

inputs:
  changelog:
    description: Path to the changelog, relative to the workspace.
    required: false
    default: CHANGELOG.md
  validate:
    description: Report where the changelog departs from the format.
    required: false
    default: "true"
  sections:
    description: >-
      Comma-separated level-3 headings to accept. Empty accepts the Keep a
      Changelog six: Added, Changed, Deprecated, Removed, Fixed, Security.
    required: false
    default: ""
  version:
    description: >-
      Release of this action to run. Empty resolves the ref the workflow named
      in `uses:`, falling back to the VERSION file committed beside this file.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install action-changelog
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
      run: "$ACTION_PATH/script/install.sh"

    - name: Validate the changelog
      shell: bash
      # Inputs reach the script through the environment, never through `${{ }}`
      # expansion: a caller's `changelog` value is interpolated before bash sees
      # the line, so a quote in it ends the argument and whatever follows runs.
      env:
        INPUT_VALIDATE: ${{ inputs.validate }}
        INPUT_CHANGELOG: ${{ inputs.changelog }}
        INPUT_SECTIONS: ${{ inputs.sections }}
      run: |
        action-changelog \
          -validate="$INPUT_VALIDATE" \
          -changelog="$INPUT_CHANGELOG" \
          -sections="$INPUT_SECTIONS"

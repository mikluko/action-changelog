name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The README's table of checks is generated from the register in code.
      # Regenerating it here catches a check added without the documentation
      # following, in the pull request that adds it.
      - name: The README's table of checks is current
        run: |
          go run ./cmd/gen-readme
          git diff --exit-code -- README.md

  # Every linter runs whatever the one before it found, so a pull request
  # learns everything that is wrong with it in one run.
  lint:
    runs-on: ubuntu-latest
    steps:
      # The tag-dependent checks and the reference tag both read the history,
      # and a default checkout is shallow and carries no tags.
      - uses: https://github.com/actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version-file: go.mod

      # .golangci.yaml carries the standard set, gocognit for complexity, and
      # gofmt.
      - name: golangci-lint
        if: ${{ !cancelled() }}
        uses: https://github.com/golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      # Scanned with the go.mod toolchain, which is the one the release builds
      # the binaries with.
      - name: govulncheck
        if: ${{ !cancelled() }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # actionlint reads a uses: naming an action by URL, the Forgejo spelling,
      # as malformed, and cannot follow the examples' reusable workflow out of
      # the .github/ they are written for.
      - name: actionlint
        if: ${{ !cancelled() }}
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -ignore 'in invalid format because owner and repo and ref should not be empty'
          -ignore 'could not read reusable workflow file'
          .forgejo/workflows/*.yaml .github/workflows/*.yaml examples/*/workflows/*.yaml

      # Built from source, so a pull request is checked by the code it changes
      # rather than by the last release of that code. prerelease-entry stays off
      # here: a release candidate is what a pull request is allowed to name, and
      # main is where it is refused.
      #
      # A pull request has to carry notes, and on a push to main, where no base
      # branch is named, missing-fragment is silent.
      - name: Validate the changelog
        id: changelog
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.base_ref }}
        run: go run ./cmd/changelog -changelog CHANGELOG.md -fragments .changelog -base "$BASE"

      # The values reach the script through the environment and never through
      # ${{ }} expansion: they come from a file the pull request author wrote.
      - name: What this pull request would publish
        if: always() && steps.changelog.outcome != 'skipped'
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          TAGGED: ${{ steps.changelog.outputs.already-tagged }}
          PRERELEASE: ${{ steps.changelog.outputs.prerelease }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "The changelog names no version." >>"$GITHUB_STEP_SUMMARY"
          elif [ "$PRERELEASE" = true ]; then
            echo "Names the candidate **v$VERSION**, which the release workflow refuses: promote it to a final version." >>"$GITHUB_STEP_SUMMARY"
          elif [ "$TAGGED" = false ]; then
            echo "Names **v$VERSION**, untagged: the next release dispatch cuts it." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Merging adds its fragments to the release after **v$VERSION**." >>"$GITHUB_STEP_SUMMARY"
          fi

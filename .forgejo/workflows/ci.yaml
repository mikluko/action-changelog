name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The README's table of checks is generated from the register in code.
      # Regenerating it here catches a check added without the documentation
      # following, in the pull request that adds it.
      - name: The README's table of checks is current
        run: |
          go run ./cmd/gen-readme
          git diff --exit-code -- README.md

  changelog:
    runs-on: ubuntu-latest
    steps:
      # The tag-dependent checks and the reference tag both read the history,
      # and a default checkout is shallow and carries no tags.
      - uses: https://github.com/actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Built from source, so a pull request is checked by the code it changes
      # rather than by the last release of that code. prerelease-entry stays off
      # here: a release candidate is what a pull request is allowed to name, and
      # main is where it is refused.
      - name: Validate the changelog
        id: changelog
        run: go run . -changelog CHANGELOG.md

      # The values reach the script through the environment and never through
      # ${{ }} expansion: they come from a file the pull request author wrote.
      - name: What this pull request would publish
        if: always() && steps.changelog.outcome != 'skipped'
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          TAGGED: ${{ steps.changelog.outputs.already-tagged }}
          PRERELEASE: ${{ steps.changelog.outputs.prerelease }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "The changelog names no version." >>"$GITHUB_STEP_SUMMARY"
          elif [ "$PRERELEASE" = true ]; then
            echo "Names the candidate **v$VERSION**. Promote it to a final version before merging: main refuses a pre-release." >>"$GITHUB_STEP_SUMMARY"
          elif [ "$TAGGED" = false ]; then
            echo "Merging cuts **v$VERSION**." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No release: **v$VERSION** is already tagged." >>"$GITHUB_STEP_SUMMARY"
          fi

name: Release

# The changelog decides, and a release is asked for by hand. A dispatch folds
# the fragments pull requests have left in .changelog/ into CHANGELOG.md,
# validates the result, commits it to main and cuts the tag the changelog then
# names. Nothing else cuts a tag here, and a tag pushed by hand is not a path.
#
# A pre-release reaching main means a candidate was released rather than
# promoted, and this refuses it.
#
# The refusal reads the prerelease output rather than raising the
# prerelease-entry check, and the difference matters. The check fires on every
# pre-release heading in the document, including entries released months ago,
# which never stop being pre-releases: using it here would fail main forever
# after the first candidate shipped. The output is a fact about the entry being
# released.
#
# One workflow rather than two, and that is forced rather than chosen. A commit
# or tag pushed with the automatic token does not trigger another workflow, so
# a job that pushed the release commit and a separate job triggered by it would
# wait on each other forever.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release. Empty computes it from the notes.
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a branch other than main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::a release is cut from main, not $REF"
          exit 1

      - uses: https://github.com/actions/checkout@v5
        with:
          # The reference tag is the newest one reachable from HEAD, so the
          # history and the tags both have to be here.
          fetch-depth: 0
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version-file: go.mod

      # This repository consumes its own action, built from source rather than
      # downloaded. The binary for the release being cut does not exist yet,
      # and a published one would be the previous version reading this commit.
      #
      # A newest entry already due is a release commit that reached main and
      # was never tagged, because a run failed after pushing it. This run then
      # resumes at the tag rather than folding again.
      - name: Read the changelog as main has it
        id: before
        run: go run ./cmd/changelog -changelog CHANGELOG.md -fragments .changelog -fail-on never

      - name: Fold the fragments into a release
        id: fold
        if: steps.before.outputs.due != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: go run ./cmd/changelog release -changelog CHANGELOG.md -fragments .changelog -version "$VERSION"

      - name: Name the release in actions/VERSION
        if: steps.before.outputs.due != 'true'
        env:
          VERSION: ${{ steps.fold.outputs.version }}
        run: printf '%s\n' "$VERSION" >actions/VERSION

      # The changelog the release commit carries, held to every check before it
      # is committed.
      - name: Validate the changelog
        id: changelog
        run: go run ./cmd/changelog -changelog CHANGELOG.md -fragments .changelog

      # The action reports; this decides. It is the only place a tag spelling is
      # chosen, which is why the action emits none.
      - name: Whether a release is due
        id: cut
        env:
          DUE: ${{ steps.changelog.outputs.due }}
          REASON: ${{ steps.changelog.outputs['due-reason'] }}
          VERSION: ${{ steps.changelog.outputs.version }}
          PRERELEASE: ${{ steps.changelog.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            echo "::error::the release names $VERSION, a pre-release. Release a final version from main."
            exit 1
          fi
          if [ "$DUE" != true ]; then
            echo "::error::nothing to release: $REASON"
            exit 1
          fi
          {
            echo "due=true"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "major=v${VERSION%%.*}"
          } >>"$GITHUB_OUTPUT"

      # The whole suite, on the tree the release commit carries: the tag about
      # to be cut, actions/VERSION and the changelog are held to each other, and
      # the documented invocations to the major, while backing out is free.
      - name: Test the release commit
        env:
          GITHUB_REF_NAME: ${{ steps.cut.outputs.tag }}
        run: go test ./...

      # The asset names and the checksums.txt format are what install.sh
      # downloads and verifies.
      - name: Build the binaries
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} \
              go build -trimpath -ldflags='-s -w' -o "$dist/changelog_${target%/*}_${target#*/}" ./cmd/changelog
          done
          (cd "$dist" && sha256sum changelog_* >checksums.txt)

      # A push refused because main moved since the checkout publishes nothing;
      # dispatching again folds onto the new main.
      - name: Commit the release to main
        if: steps.before.outputs.due != 'true'
        env:
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@noreply.sarak.sh"
          git commit -am "release: $VERSION"
          git push origin HEAD:refs/heads/main

      - name: Cut the tag
        env:
          TAG: ${{ steps.cut.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"


      # notes is the entry body verbatim, which is what the release page wants
      # and the one output whose value is prose rather than a fact about a tag.
      - name: Publish the release
        if: steps.cut.outputs.due == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cut.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          api="${GITHUB_API_URL:-$GITHUB_SERVER_URL/api/v1}/repos/$GITHUB_REPOSITORY"
          printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
          jq -n --arg tag "$TAG" --rawfile body "$RUNNER_TEMP/notes.md" \
            '{tag_name: $tag, name: $tag, body: $body}' >"$RUNNER_TEMP/release.json"
          # The pushed tag makes Forgejo record a release of its own for it,
          # asynchronously. A request racing that record fails on the unique
          # tag; once the record exists, the same request turns it into this
          # release.
          id=
          for attempt in 1 2 3 4 5 6; do
            if id=$(curl -fsS -X POST "$api/releases" \
              -H "Authorization: token $TOKEN" \
              -H 'Content-Type: application/json' \
              --data @"$RUNNER_TEMP/release.json" | jq -er .id); then
              break
            fi
            id=
            echo "attempt $attempt: could not create the release for $TAG"
            sleep 5
          done
          if [ -z "$id" ]; then
            echo "::error::could not create the release for $TAG"
            exit 1
          fi
          for asset in "$RUNNER_TEMP"/dist/*; do
            curl -fsS -o /dev/null -X POST "$api/releases/$id/assets?name=${asset##*/}" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$asset"
          done

      # The action as a consumer runs it: action.yaml at this commit, with the
      # binary downloaded from the release just published. It runs before the
      # major tag moves, so a broken release never reaches the consumers that
      # follow it.
      - name: Run the published action
        id: smoke
        if: steps.cut.outputs.due == 'true'
        uses: ./actions/validate

      - name: The published action reads the release just cut
        if: steps.cut.outputs.due == 'true'
        env:
          WANT: ${{ steps.cut.outputs.version }}
          VERSION: ${{ steps.smoke.outputs.version }}
          TAGGED: ${{ steps.smoke.outputs.already-tagged }}
        run: |
          if [ "$VERSION" != "$WANT" ] || [ "$TAGGED" != true ]; then
            echo "::error::the published action reports version=${VERSION:-none} already-tagged=$TAGGED, want $WANT and true"
            exit 1
          fi

      # The writers as a consumer runs them, on a copy so the checkout stays
      # what was released.
      - name: Copy the changelog for the writers
        if: steps.cut.outputs.due == 'true'
        run: cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"

      - name: Run the published append action
        if: steps.cut.outputs.due == 'true'
        uses: ./actions/append
        with:
          changelog: ${{ runner.temp }}/CHANGELOG.md
          section: Added
          note: The release workflow's smoke test.

      - name: Run the published release action
        id: smoke-release
        if: steps.cut.outputs.due == 'true'
        uses: ./actions/release
        with:
          changelog: ${{ runner.temp }}/CHANGELOG.md

      - name: The published release action released the appended note
        if: steps.cut.outputs.due == 'true'
        env:
          VERSION: ${{ steps.smoke-release.outputs.version }}
          NOTES: ${{ steps.smoke-release.outputs.notes }}
        run: |
          case "$NOTES" in
            *"The release workflow's smoke test."*) ;;
            *) echo "::error::the published release action released version=${VERSION:-none} without the appended note"; exit 1 ;;
          esac

      # Last, because it is the reference consumers follow and it should move
      # only once everything above it is in place. No pre-release reaches here,
      # so it always names a final version.
      - name: Move the major tag
        if: steps.cut.outputs.due == 'true'
        env:
          MAJOR: ${{ steps.cut.outputs.major }}
        run: |
          git tag -f "$MAJOR"
          git push -f origin "refs/tags/$MAJOR"

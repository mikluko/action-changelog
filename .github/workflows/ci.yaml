name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The README's table of checks is generated from the register in code.
      # Regenerating it here catches a check added without the documentation
      # following, in the pull request that adds it.
      - name: The README's table of checks is current
        run: |
          go run ./cmd/gen-readme
          git diff --exit-code -- README.md

  changelog:
    runs-on: ubuntu-latest
    steps:
      # The tag-dependent checks and the reference tag both read the history,
      # and a default checkout is shallow and carries no tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Built from source, so a pull request is checked by the code it changes
      # rather than by the last release of that code. Findings land as workflow
      # annotations on the offending line of the diff.
      - name: Validate the changelog
        id: changelog
        run: go run . -validate -changelog CHANGELOG.md

      # A release pull request should say so in its own checks. The workflow on
      # main cuts whatever the changelog names, so a reviewer is entitled to know
      # what merging does before they merge it.
      #
      # The values reach the script through the environment and never through
      # ${{ }} expansion: they come from a file the pull request author wrote.
      - name: What merging would cut
        if: always() && steps.changelog.outcome != 'skipped'
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          TAGGED: ${{ steps.changelog.outputs.already-tagged }}
          LATEST: ${{ steps.changelog.outputs.latest-tag }}
        run: |
          if [ "$TAGGED" = false ] && [ -n "$VERSION" ]; then
            echo "Merging cuts **v$VERSION**, over ${LATEST:-no previous tag}." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No release: the newest entry is already tagged, or the changelog names none." >>"$GITHUB_STEP_SUMMARY"
          fi

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Both platforms, because the release workflow publishes both. A build
      # that breaks only there breaks at the moment a tag is cut, when the tag
      # already exists and backing out is no longer free.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64

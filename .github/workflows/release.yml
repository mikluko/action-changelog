name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # action.yml is written in the release pull request and is what a consumer
      # resolves, so a tag whose action.yml names a different version would ship
      # the wrong image. The test reads GITHUB_REF_NAME and holds the tag,
      # action.yml and CHANGELOG.md to one version, before anything is published.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -run TestActionPinsTheChangelogVersion .

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mikluko/action-changelog:${{ github.ref_name }}

      # The moving major tag is what consumers write in `uses:`. It moves only
      # once the image it resolves to is in the registry.
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

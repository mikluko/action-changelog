name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # VERSION is what a SHA-pinned workflow downloads, so a tag whose VERSION
      # names a different release would ship a reference to assets that are not
      # in it. The test reads GITHUB_REF_NAME and holds the tag, VERSION and
      # CHANGELOG.md to one version, before anything is published.
      - run: go test -run TestVersionMatchesTheChangelog .

      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The moving major tag is what consumers write in `uses:`, and
      # script/install.sh resolves it straight to a release. It moves only once
      # that release's assets exist.
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

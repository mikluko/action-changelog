name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # action.yml names the image tag, VERSION names the release and
      # CHANGELOG.md names the version. The test holds all three to the tag
      # being cut, before anything is published and while backing out is free.
      - run: go test -run TestVersionMatchesTheChangelog .

      - name: The major tag
        id: v
        run: echo "major=${GITHUB_REF_NAME%%.*}" >>"$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mikluko/action-changelog:${{ github.ref_name }}
            ghcr.io/mikluko/action-changelog:${{ steps.v.outputs.major }}

      # The moving major tag is what consumers write in `uses:`, and it resolves
      # to an action.yml naming an image that exists by the time it moves. It is
      # last for that reason.
      - name: Move the major tag
        env:
          MAJOR: ${{ steps.v.outputs.major }}
        run: |
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The action runs on Linux only, but the validator is also run directly with
    # `go run`, so the code is held to every platform it claims to compile on.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # This repository's changelog is the nearest real document to run against,
      # and a validator that cannot pass its own file has nothing to say.
      - name: Validate this repository's own changelog
        run: go run . -validate -changelog CHANGELOG.md

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The release workflow pushes this image. A build that breaks only there
      # breaks at the moment a tag is cut, when the tag already exists.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false

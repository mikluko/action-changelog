name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The action runs on Linux only, but the validator is also run directly with
    # `go run`, so the code is held to every platform it claims to compile on.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The tag-dependent checks read this repository's own tags in the
      # self-validation step below, and a default checkout carries none.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # This repository's changelog is the nearest real document to run against,
      # and a validator that cannot pass its own file has nothing to say.
      - name: Validate this repository's own changelog
        run: go run . -validate -changelog CHANGELOG.md
      # The README's table of checks is generated from the register in code.
      # Regenerating it here catches a check added without the documentation
      # following, in the pull request that adds it.
      - name: The README's table of checks is current
        if: runner.os == 'Linux'
        run: |
          go run ./cmd/gen-readme
          git diff --exit-code -- README.md

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The release workflow pushes this image. A build that breaks only there
      # breaks at the moment a tag is cut, when the tag already exists.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false

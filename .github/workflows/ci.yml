name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: action-changelog:ci
      - name: Validate this repository's own changelog
        run: |
          docker run --rm \
            -e GITHUB_ACTIONS=true \
            -v "$PWD:/github/workspace" -w /github/workspace \
            action-changelog:ci -validate=true -changelog=CHANGELOG.md

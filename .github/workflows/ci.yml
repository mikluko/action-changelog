name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The action is a composite running a native binary, so the platforms it
    # claims to support are the platforms it is tested on.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Validate this repository's own changelog
        run: go run . -validate -changelog CHANGELOG.md

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --snapshot --clean
      - name: The archives are named as script/install.sh asks for them
        run: |
          test -f dist/action-changelog_linux_amd64.tar.gz
          test -f dist/action-changelog_darwin_arm64.tar.gz
          test -f dist/action-changelog_windows_amd64.tar.gz

  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck script/install.sh

name: Changelog

# The pull-request invocation. It relaxes undated-entry for a different reason
# than the branch does: a pull request may target the stabilization branch, where
# the newest entry is legitimately open, or the trunk, where it is not, and
# nothing in the binary knows which. The two push invocations decide, once the
# commit has landed somewhere.
on:
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag-dependent checks read the repository's tags, and a default
          # checkout carries none: no-git-tags fires and names this line.
          fetch-depth: 0
      - uses: mikluko/action-changelog@v0
        with:
          sections: Added,Changed,Deprecated,Removed,Fixed,Security,Breaking
          # Quoted because YAML 1.1 reads a bare off as false, and the input has
          # to survive whichever parser reads this file.
          "off": undated-entry

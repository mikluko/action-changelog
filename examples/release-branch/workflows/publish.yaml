name: publish
run-name: 📦 Publish ${{ github.ref_name }}

# What a tag means. Both kinds arrive here: the candidates a stabilization
# branch cuts and the release the trunk cuts, and the difference is the tag.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*.*'

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changelog
        uses: mikluko/action-changelog@v1
        with:
          sections: Added,Changed,Deprecated,Removed,Fixed,Security,Breaking
          error: prerelease-entry
          # This is the invocation a repository forgets. It runs on the
          # candidate tags a branch cuts, and at that moment the newest entry is
          # legitimately open: it names the version and carries no date. Without
          # this the *build* fails rather than the check.
          #
          # undated-release stays on. A tag naming the version with no date on
          # the entry is the case that check exists for.
          "off": undated-entry

  # Where a repository builds its images and charts, from the tag rather than
  # from a branch. Nothing here reads the changelog: the tag is the version.
  artifacts:
    needs: [changelog]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build ${{ github.ref_name }}."

  # The notes are the changelog's newest entry, which is this tag's entry only
  # when that entry names this tag. A candidate tag names 1.3.0-rc.4 and the
  # entry names 1.3.0, so a candidate files no release and gets no notes.
  release:
    needs: [changelog, artifacts]
    if: github.ref_name == format('v{0}', needs.changelog.outputs.version)
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.changelog.outputs.notes }}
        run: gh release create "$TAG" --title "$TAG" --notes "$NOTES" --verify-tag

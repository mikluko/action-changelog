name: Changelog

# The trunk invocation. The stabilization branch merges here, and that merge is
# what dates the entry, so undated-entry is left at its default, which is error:
# an entry that reaches the trunk still open fails.
#
# prerelease-entry is raised here and on neither of the other two. A candidate is
# a version the entry names under this strategy, which is legitimate on the
# branch and never on the trunk: a release that reaches the trunk still carrying
# an identifier is one nobody finished.
on:
  push:
    branches: [main]

# Reading writes nothing. Only the job that pushes a tag is granted more, at that
# job rather than here, so nothing else in the file can reach it.
permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Published for the tag job, which is a separate job and so cannot read
    # another's steps.
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      prerelease: ${{ steps.changelog.outputs.prerelease }}
      already-tagged: ${{ steps.changelog.outputs.already-tagged }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag-dependent checks read the repository's tags, and a default
          # checkout carries none: no-git-tags fires and names this line.
          fetch-depth: 0
      - uses: mikluko/action-changelog@v1
        id: changelog
        with:
          sections: Added,Changed,Deprecated,Removed,Fixed,Security,Breaking
          error: prerelease-entry

  # The stabilization branch's tag job with one word changed: final rather than
  # pre-release. Both cut the version the entry names and neither composes one,
  # which is the whole of the strategy in two guards.
  #
  # A merge to the trunk arrives through a pull request, so a repository with
  # branch protection has already tested it. Naming a test job in needs: here
  # closes the gap for a direct push as well, which is the case protection is
  # usually configured to refuse rather than to test.
  tag:
    needs: [changelog]
    if: >-
      needs.changelog.outputs.prerelease == 'false' &&
      needs.changelog.outputs.already-tagged == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Cut the release
        env:
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

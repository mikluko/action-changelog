name: Changelog

# The stabilization-branch invocation. The release is open here: its entry names
# a version and carries no date, because the release date is not known while the
# branch is still accumulating. undated-entry is the check that says an undated
# newest entry is a defect, and switching it off on this branch and nowhere else
# is most of what the strategy costs in configuration.
#
# prerelease-entry is not raised here, and that is the rest of it. A candidate
# under this strategy is a version the entry names, so a pre-release heading is
# this branch working as intended. The trunk still raises it.
on:
  push:
    branches: ['release/*']

# Reading writes nothing. Only the job that pushes a tag is granted more, at that
# job rather than here, so nothing else in the file can reach it.
permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Published for the tag job, which is a separate job and so cannot read
    # another's steps.
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      prerelease: ${{ steps.changelog.outputs.prerelease }}
      already-tagged: ${{ steps.changelog.outputs.already-tagged }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag-dependent checks read the repository's tags, and a default
          # checkout carries none: no-git-tags fires and names this line.
          fetch-depth: 0
      - uses: mikluko/action-changelog@v1
        id: changelog
        with:
          sections: Added,Changed,Deprecated,Removed,Fixed,Security,Breaking
          # Quoted because YAML 1.1 reads a bare off as false, and the input has
          # to survive whichever parser reads this file.
          #
          # undated-release is deliberately not beside it. That one fires where
          # the newest entry carries no date and a *final* tag already names its
          # version, which is a release that shipped and nobody dated, and this
          # branch wants it as much as the trunk does. The candidate tags cut
          # here name candidates, so they never trip it.
          "off": undated-entry
          # The default, written down because this is the branch where raising it
          # to all looks right and is not: the reference would become a candidate
          # tag cut here, whose changelog already carries the entry that named it,
          # so release-entry-modified would fire the moment that entry is
          # rewritten for the next candidate.
          reference-tags: final

  # The tag is cut in a job of its own so that something can be put in front of
  # it. Every push to this branch publishes, and a push arrives without a pull
  # request, so nothing else gates it: add your test job to the repository and
  # name it in needs: below, and a push that does not build cuts no tag.
  #
  # That seam is the whole reason this is a job rather than a step. A step in the
  # job above has no boundary a needs: can be inserted at.
  tag:
    needs: [changelog]
    # The tag is the version the entry names, with a v in front. Nothing is
    # composed: writing 1.3.0-rc.2 in the heading is what cuts v1.3.0-rc.2, and a
    # second candidate is that heading rewritten rather than this job run again.
    #
    # Two guards, and the trunk carries the same two with one word changed. This
    # branch cuts what the entry names while that version is a pre-release; the
    # trunk cuts it while it is final. Dropping the identifier is how a branch
    # says the release is ready, so cutting it here would take the final tag off
    # the trunk.
    if: >-
      needs.changelog.outputs.prerelease == 'true' &&
      needs.changelog.outputs.already-tagged == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # A tag pushed with the default GITHUB_TOKEN triggers no workflow. A
      # repository whose publish runs on the tag passes a token of its own here.
      #
      # The version reaches the script through the environment and never through
      # ${{ }} expansion: it comes from a file a contributor wrote.
      - name: Cut the candidate
        env:
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
